    exceptions: [h('도시 vs 나라', '도시와 작은 섬은 a(a Roma, a Seoul), 나라·지역·대륙은 in(in Italia, in Corea, in Europa)이에요.'), h('덩어리로 외우는 장소', 'a casa, a scuola, a letto, a teatro / in ufficio, in banca, in farmacia, in biblioteca, in centro, in cucina, in camera. 이유 없이 굳은 표현이니 통째로 익혀요.'), h('관사가 붙는 경우', '장소 앞에 관사가 붙으면 전치사와 합쳐져요: al cinema, al bar, al ristorante, nel parco, nella stanza.'), h('나라에 관사가 붙는 경우', '복수형이나 관사가 있는 나라는 in + 관사: negli Stati Uniti.')],

<script>/* 영구 저장: IndexedDB(기본) → 실패 시 localStorage. 앱을 종료해도 데이터가 유지된다. */

    });

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + g + '</svg>';

  /* ───────── 플래시카드 세션 ───────── */
  function startCards(kind, ids, title) {
    ids = ids.filter(id => WM[id]);
    if (!ids.length) { toast('학습할 단어가 없어요.'); return; }
    UI.cards = { kind, title, queue: ids.slice(), idx: 0, revealed: false, session: C.startSession(S, nowIso()), total: ids.length, stat: { again: 0, hard: 0, normal: 0, easy: 0 }, studied: [], repeat: false, requeued: {} };
    UI.mode = 'cards'; commit(); render(); window.scrollTo(0, 0);
  }
  function previewDays(id, rating) {
    const p = S.progress[id] ? Object.assign({}, S.progress[id]) : C.newProgress(id);
    C.applyRating(p, rating, today, today); return p.interval_days === 0 ? '오늘' : p.interval_days + '일 후';
  }
  function vCards() {

    if (!K.revealed) {
      card = '<div class="flash" data-act="reveal" role="button" tabindex="0" aria-label="탭하면 뜻이 보여요"><div class="word-big">' + esc(w.word) + '</div><div class="pron">' + esc(w.pronunciation_ko) + '</div><div class="ipa">' + esc(w.ipa) + '</div>' +
        '<button class="iconbtn" data-act="speak" data-text="' + esc(w.word) + '" aria-label="발음 듣기">' + svg('speak') + '</button><div class="hint">뜻을 먼저 떠올려 보세요. 카드를 탭하면 정답이 보여요.</div></div>';
    } else {
      card = '<div class="flash" style="cursor:default"><div class="row" style="gap:8px"><div class="word-big" style="font-size:clamp(34px,10vw,46px)">' + esc(w.word) + '</div></div><div class="row"><span class="pron" style="font-size:17px">' + esc(w.pronunciation_ko) + '</span><span class="ipa">' + esc(w.ipa) + '</span></div>' +
        '<div class="meaning">' + esc(w.meaning_ko) + '</div><div class="en">' + esc(w.meaning_en) + '</div><div class="forms">' + formsLine(w) + '</div>' +
        '<div class="example"><div class="it">' + esc(w.example_it) + '</div><div class="ko">' + esc(w.example_ko) + '</div></div>' +
        '<div class="row wrap" style="justify-content:center"><button class="btn soft small" data-act="speak" data-text="' + esc(w.word) + '">' + svg('speak', 16) + ' 단어</button><button class="btn soft small" data-act="speak" data-text="' + esc(w.example_it) + '">' + svg('speak', 16) + ' 예문</button><button class="btn ' + (K.repeat ? '' : 'ghost') + ' small" data-act="toggleRepeat" aria-pressed="' + K.repeat + '">' + svg('repeat', 16) + ' 3회 반복</button></div></div>';
    }
    const rate = K.revealed ? '<div class="rate">' + [['again', '다시 학습'], ['hard', '어려움'], ['normal', '보통'], ['easy', '쉬움']].map(([k, l]) => '<button class="' + k + '" data-act="rate" data-r="' + k + '">' + l + '<small>' + previewDays(w.id, k) + '</small></button>').join('') + '</div>' : '<div style="height:66px"></div>';
    return topbar + card + rate;
  }
  function vCardsDone() {
    const K = UI.cards, tot = K.stat.again + K.stat.hard + K.stat.normal + K.stat.easy;
    return '<div class="stripe"></div><div class="card" style="text-align:center"><div class="col" style="align-items:center"><div class="tag">학습 완료</div><div class="big-num">' + K.total + '개</div><p class="sub">' + esc(K.title) + '을(를) 마쳤어요</p></div></div>' +
      '<div class="grid2"><div class="stat"><span>다시 학습</span><b>' + K.stat.again + '</b></div><div class="stat"><span>어려움</span><b>' + K.stat.hard + '</b></div><div class="stat"><span>보통</span><b>' + K.stat.normal + '</b></div><div class="stat"><span>쉬움</span><b>' + K.stat.easy + '</b></div></div>' +
      '<button class="btn" data-act="cardsQuiz">방금 배운 단어 퀴즈로 확인</button>' +
      (K.kind === 'new' && C.candidatesForNew(S, WORDS, S.daily.newIds).length ? '<button class="btn soft" data-act="extend">새 단어 더 학습하기</button>' : '') +
      (C.getDue(S, WORDS, today).length && K.kind !== 'review' ? '<button class="btn ghost" data-act="startReview">복습 이어가기 (' + C.getDue(S, WORDS, today).length + '개)</button>' : '') +
      '<button class="btn ghost" data-act="closeCards">홈으로</button>';
  }
  function rateCard(rating) {
    const K = UI.cards, id = K.queue[K.idx], res = C.rate(S, id, rating, today, nowIso());
    C.sessionTick(K.session, res.isNew, rating !== 'again'); K.stat[rating]++;
    if (K.studied.indexOf(id) < 0) K.studied.push(id);
    if (rating === 'again' && (K.requeued[id] || 0) < 3) { K.requeued[id] = (K.requeued[id] || 0) + 1; K.queue.push(id); }
    K.idx++; K.revealed = false;
    if (K.idx >= K.queue.length) C.finishSession(K.session, nowIso());
    commit(); render(); window.scrollTo(0, 0);
  }

  /* ───────── 퀴즈 ───────── */
  function quizTargets(src) {
    const learned = WORDS.filter(w => S.progress[w.id] && S.progress[w.id].introduced_on);
    if (src === 'due') return C.getDue(S, WORDS, today);
    if (src === 'wrong') return C.wrongBook(S, WORDS).filter(x => !x.cleared).map(x => x.word);
    if (src === 'today') return learned.filter(w => S.progress[w.id].introduced_on === today).length ? learned.filter(w => S.progress[w.id].introduced_on === today) : learned.slice().sort((a, b) => (S.progress[b.id].introduced_on < S.progress[a.id].introduced_on ? -1 : 1));
    return learned;
  }
  function openQuiz(src) {
    UI.qsetup = { src, types: new Set(C.QTYPES), n: 10 }; UI.sheet = { type: 'quizsetup' }; render();
  }
  function startQuiz(words, types, n, title) {
    const picked = C.shuffle(words).slice(0, n);
    if (!picked.length) { toast('시험을 볼 단어가 없어요. 먼저 단어를 학습해 주세요.'); return; }
    const qs = C.buildQuiz(picked, WORDS, types, Math.random, { canSpeak: ttsAvailable() });
    UI.quiz = { title, qs, i: 0, picked: null, graded: null, results: [], types, session: C.startSession(S, nowIso()) };
    UI.sheet = null; UI.mode = 'quiz'; commit(); render(); window.scrollTo(0, 0);
    autoSpeakQuestion();
  }
  function autoSpeakQuestion() { const Q = UI.quiz; if (Q && !Q.graded && Q.qs[Q.i] && Q.qs[Q.i].type === 'listen') setTimeout(() => speak(Q.qs[Q.i].speak), 250); }
  function vQuiz() {
    const Q = UI.quiz, q = Q.qs[Q.i], g = Q.graded;
    const top = '<div class="study-top"><button class="iconbtn" data-act="closeQuiz" aria-label="퀴즈 종료">' + svg('close') + '</button><div class="grow"><div class="row between sub"><span>' + esc(Q.title) + ' · ' + QT_KO[q.type] + '</span><span>' + (Q.i + 1) + ' / ' + Q.qs.length + '</span></div><div class="bar" style="margin-top:6px"><i style="width:' + Math.round(Q.i / Q.qs.length * 100) + '%"></i></div></div></div>';
    let card = '<div class="q-card"><div class="q-prompt ' + (q.type === 'cloze' ? 'sentence' : '') + '">' + esc(q.prompt) + '</div>' + (q.promptSub ? '<div class="sub">' + esc(q.promptSub) + '</div>' : '') +
      (q.speak ? '<button class="btn soft" data-act="speak" data-text="' + esc(q.speak) + '">' + svg('speak', 18) + ' 다시 듣기</button>' : '') + '</div>';
    let ans = '';
    if (q.options) {
      ans = '<div class="opts">' + q.options.map(o => '<button class="opt ' + (g ? (o.id === q.answerId ? 'right' : (o.id === Q.picked ? 'wrong' : '')) : '') + '" data-act="pick" data-id="' + esc(o.id) + '" ' + (g ? 'disabled' : '') + '>' + (g ? (o.id === q.answerId ? '<span class="mk">✓ 정답</span> ' : (o.id === Q.picked ? '<span class="mk">✗ 내 답</span> ' : '')) : '') + esc(o.label) + '</button>').join('') + '</div>';
    } else if (!g) {
      ans = '<input id="qin" class="field" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="이탈리아어로 입력" aria-label="답 입력"><div class="chips">' + ['à', 'è', 'é', 'ì', 'ò', 'ù'].map(ch => '<button class="chip" data-act="ins" data-ch="' + ch + '" aria-label="' + ch + ' 입력">' + ch + '</button>').join('') + '</div><button class="btn" data-act="submitText">확인</button>';
    } else ans = '<input class="field" value="' + esc(Q.picked) + '" disabled aria-label="내 답">';
    let fb = '';
    if (g) {
      const hint = g.kind === 'accent' ? '철자는 같지만 악센트가 달라요. ' : g.kind === 'typo' ? '한 글자 차이로 틀렸어요. ' : g.kind === 'empty' ? '답을 입력하지 않았어요. ' : '';
      fb = '<div class="feedback ' + (g.correct ? 'ok' : 'no') + '"><b>' + (g.correct ? '✓ 정답이에요' : '✗ 오답이에요') + '</b>' + (g.correct ? '' : ' ' + hint + '정답: ' + esc(g.expected)) + '<div class="exp">' + esc(q.explanation) + '</div></div><button class="btn" data-act="nextQ">' + (Q.i + 1 >= Q.qs.length ? '결과 보기' : '다음 문제') + '</button>';
    }
    return top + card + ans + fb;
  }
  function answerQuiz(answer) {
    const Q = UI.quiz; if (Q.graded) return; const q = Q.qs[Q.i], g = C.gradeAnswer(q, answer);
    Q.graded = g; Q.picked = answer; Q.results.push({ q, answer, g });
    C.recordQuiz(S, q, answer, g.correct, today, nowIso()); C.sessionTick(Q.session, false, g.correct); commit(); render();
  }
  function nextQuestion() {
    const Q = UI.quiz; Q.i++; Q.graded = null; Q.picked = null;
    if (Q.i >= Q.qs.length) { C.finishSession(Q.session, nowIso()); UI.mode = 'result'; commit(); }
    render(); window.scrollTo(0, 0); if (UI.mode === 'quiz') autoSpeakQuestion();
  }
  function vResult() {
    const Q = UI.quiz, ok = Q.results.filter(r => r.g.correct).length, n = Q.results.length, pct = n ? Math.round(ok / n * 100) : 0, wrong = Q.results.filter(r => !r.g.correct);
    return '<div class="stripe"></div><div class="card" style="text-align:center"><div class="col" style="align-items:center"><span class="tag ' + (pct >= 80 ? '' : pct >= 50 ? 'sun' : 'red') + '">' + esc(Q.title) + '</span><div class="big-num">' + pct + '%</div><p class="sub">' + n + '문제 중 ' + ok + '개 정답 · ' + wrong.length + '개 오답</p></div></div>' +
      (wrong.length ? '<p class="sub">틀린 단어 ' + wrong.length + '개는 오답 노트에 저장됐어요.</p>' : '<p class="sub">모두 맞혔어요.</p>') +
      '<div class="col">' + (wrong.length ? '<button class="btn" data-act="retryWrong">틀린 단어 재시험 (' + wrong.length + ')</button>' : '') + '<button class="btn ' + (wrong.length ? 'ghost' : '') + '" data-act="restartQuiz">같은 범위로 다시 풀기</button><button class="btn ghost" data-act="closeQuiz">닫기</button></div>' +
      '<div class="sectionhead"><h3>문제별 해설</h3></div><div class="card flat"><div class="list">' + Q.results.map(r => '<div class="li" style="align-items:flex-start"><span class="mkb ' + (r.g.correct ? 'ok' : 'no') + '" aria-label="' + (r.g.correct ? '정답' : '오답') + '">' + (r.g.correct ? '✓' : '✗') + '</span><span class="grow"><b>' + esc(WM[r.q.wordId] ? WM[r.q.wordId].word : r.q.answerLabel) + '</b> <span class="sub">' + QT_KO[r.q.type] + '</span><div class="sub">' + (r.g.correct ? '정답' : '내 답: ' + esc(optionLabel(r) || '(없음)') + ' → 정답: ' + esc(r.g.expected)) + '</div><div class="sub" style="font-style:italic">' + esc(r.q.explanation.split('\n')[1] || '') + '</div></span></div>').join('') + '</div></div>';
  }
  function optionLabel(r) { if (r.q.options) { const o = r.q.options.find(x => x.id === r.answer); return o ? o.label : ''; } return r.answer; }

  /* ───────── 시트 ───────── */

  /* ───────── 이벤트 ───────── */

    levelAsk() { const ls = C.levelStatus(S, WORDS, S.settings.current_cefr_level); const has = WORDS.some(w => w.cefr_level === ls.next); UI.sheet = { type: 'confirm', title: ls.next + ' 단계로 올릴까요?', msg: has ? '새 단어가 ' + ls.next + ' 단계에서 나와요. 배운 단어는 계속 복습돼요.' : ls.next + ' 단어는 아직 내장돼 있지 않아요. 올리면 새 단어 배정이 비어 있으니, 단어장에서 CSV로 ' + ls.next + ' 단어를 가져온 뒤 올리는 걸 권해요.', act: 'levelDo', yes: '올리기' }; render(); },

    resetAsk() { UI.sheet = { type: 'confirm', title: '모든 기록 초기화', msg: '학습 기록, 오답 노트, 개인 단어가 모두 지워져요. 먼저 백업을 내보내 두는 걸 권해요.', act: 'resetDo', yes: '초기화' }; render(); },

  document.addEventListener('click', ev => {

      else { s.notification_enabled = t.checked && 'Notification' in window; if (t.checked && !('Notification' in window)) toast('이 브라우저는 알림을 지원하지 않아요.'); }

  /* ───────── 날짜 변경·알림·시작 ───────── */
  function dayCheck() {

  window.addEventListener('pagehide', () => { if (S) flush(); });

  async function init() {

    store = Store.create(window.indexedDB, ls);

  window.App = { hooks, A, UI, start: init, render, commit, flush, esc, svg, toast, speak, head, ttsAvailable, ttsSupported, fmtDate, wordRow,
    get S() { return S; }, get WORDS() { return WORDS; }, get WM() { return WM; }, get today() { return today; }, nowIso, C, BUILTIN, closeSheet };
})();

<script>/* Italiano — 문장 만들기·문법·회화·듣기/말하기·학습 현황 화면. app.js의 window.App 확장 지점에 붙는다.

    off_meaning: ['△', '문법은 맞지만 의도한 의미와 달라요', 'warn'], unverified: ['?', '자동으로 판정하지 못했어요', 'info'], empty: ['', '입력이 없어요', 'info']

    UI.sheet = null; UI.mode = 'x:rv'; App.render(); window.scrollTo(0, 0);
  };
  const rvTask = it => it.type === 'cloze' ? Object.assign({}, it, { type: 'complete', module: 'rv', skill: null }) : Object.assign({}, it, { module: 'rv', skill: null });
  H.modes.rv = () => {
    const R = X.rv; if (!R) { UI.mode = null; return ''; }
    const ses = R.ses, n = R.all.length;
    if (R.phase === 'rule') return topBar('복습 · ' + ses.label, '핵심 규칙', 'rvClose') + '<div class="card"><div class="col"><span class="tag sun">AI 작성 · 검수 전</span>' + ses.rule.map(r => '<div><b>' + esc(r.h) + '</b><p>' + esc(r.p) + '</p></div>').join('') + (ses.tip ? '<div class="card flat"><b>기억하는 법</b><p>' + esc(ses.tip) + '</p></div>' : '') + '</div></div><button class="btn" data-act="rvStart">문제 풀기 (' + n + '개)</button><button class="btn ghost" data-act="rvClose">나중에 하기</button>';
    if (R.phase === 'end') {
      const d = R.done;
      return '<div class="stripe"></div><div class="card" style="text-align:center"><div class="col" style="align-items:center"><div class="tag">' + esc(ses.label) + ' 복습 마침</div><div class="big-num">' + R.ok + ' / ' + n + '</div><p class="sub">첫 시도에 맞힌 문제</p></div></div>' +
        '<div class="card"><div class="col"><b>' + (d.pass ? '잘했어요' : '조금 더 연습해요') + '</b><p class="sub">이 유형은 학습 기록(복습 간격)에 다시 등록됐어요. ' + (d.pass ? '' : '내일 다시 나와요. ') + '다음 복습 예정: ' + esc(App.fmtDate(d.next)) + '</p><button class="btn soft" data-act="rvAgain">같은 유형 한 번 더 보기</button></div></div>' +
        '<div class="grid2"><button class="btn" data-act="rvToSb">문장 연습으로</button><button class="btn ghost" data-act="rvClose">닫기</button></div>';
    }
    const it = R.all[R.idx], isW = R.idx >= ses.items.length;
    let b = topBar('복습 · ' + ses.label, (R.idx + 1) + ' / ' + n, 'rvClose', Math.round(R.idx / n * 100)) + '<div class="q-card"><div class="tag">' + (isW ? '새 문장 쓰기' : { mcq: '객관식', cloze: '빈칸', fix: '오류 고치기', translate: '번역' }[it.type]) + '</div>';
    if (it.type === 'mcq') b += '<div class="q-prompt sentence">' + esc(it.q) + '</div></div>';
    else if (it.type === 'cloze') b += '<div class="q-prompt sentence">' + esc(it.q) + '</div><div class="sub">' + esc(it.ko || '') + '</div></div>';
    else if (it.type === 'fix') b += '<div class="sub">틀린 곳을 고쳐 쓰세요.</div><div class="q-prompt sentence wrongline">' + esc(it.wrong) + '</div><div class="sub">' + esc(it.ko || '') + '</div></div>';
    else b += '<div class="q-prompt">' + esc(it.ko) + '</div></div>';
    if (R.phase === 'q') {
      if (it.type === 'mcq') b += '<div class="opts">' + it.options.map((o, i) => '<button class="opt" data-act="rvPick" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
      else { const one = it.type === 'cloze'; b += (one ? '<input id="rvin" class="field" value="' + esc(R.text) + '" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="빈칸에 들어갈 말" aria-label="답 입력">' : '<textarea id="rvin" class="field" rows="3" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="이탈리아어로 써 보세요" aria-label="답 입력">' + esc(R.text) + '</textarea>') + accentRow('rvin') + '<button class="btn" data-act="rvSubmit">확인</button>'; }
    } else {
      const r = R.res, ok = r.cls === 'natural', last = R.idx + 1 >= n;
      if (it.type === 'mcq') b += '<div class="opts">' + it.options.map((o, i) => '<button class="opt ' + (i === it.answer ? 'right' : i === R.picked ? 'wrong' : '') + '" disabled>' + (i === it.answer ? '<span class="mk">✓ 정답</span> ' : i === R.picked ? '<span class="mk">✗ 내 답</span> ' : '') + esc(o) + '</button>').join('') + '</div>';
      b += '<div class="feedback ' + (ok ? 'ok' : 'no') + '"><b>' + (ok ? '✓ 정답이에요' : '✗ ' + (CLS[r.cls] || CLS.ungrammatical)[1]) + '</b>' + (it.why ? '<div class="exp">' + esc(it.why) + '</div>' : '') + '</div>';
      if (it.type !== 'mcq') b += '<div class="card flat"><div class="col"><div><div class="sub">내 답</div><div class="sent">' + esc(R.text) + '</div></div>' + (r.fixed && !ok ? '<div><div class="sub">고친 문장</div><div class="sent good">' + esc(r.fixed) + '</div></div>' : '') + '</div></div>';
      b += '<div class="col">' + (!ok && it.type !== 'mcq' && R.tries < 2 ? '<button class="btn" data-act="rvRetry">다시 써 보기</button>' : '') + '<button class="btn ' + (!ok && it.type !== 'mcq' && R.tries < 2 ? 'ghost' : '') + '" data-act="rvNext">' + (last ? '마치기' : '다음 문제') + '</button></div>';
    }
    return b;
  };
  A.rvStart = () => { X.rv.phase = 'q'; App.render(); window.scrollTo(0, 0); };
  A.rvPick = d => { const R = X.rv, it = R.all[R.idx], i = Number(d.i), ok = i === it.answer; R.picked = i; R.text = it.options[i]; R.res = { cls: ok ? 'natural' : 'ungrammatical', issues: [] }; if (R.tries === 0) { R.firstOk = ok; if (ok) R.ok++; } R.phase = 'fb'; App.render(); };
  A.rvSubmit = () => {
    const R = X.rv, it = R.all[R.idx], el = document.getElementById('rvin'), text = el ? el.value : R.text; R.text = text; if (!text.trim()) { toast('답을 입력해 주세요.'); return; }
    let r; try { r = M.submit(S(), E(), rvTask(it), text, App.today, nowIso(), { retry: R.tries > 0 }); } catch (e) { console.error(e); toast('판정 중 문제가 생겼어요.'); return; }
    if (!r.attempt) return; const ok = r.res.cls === 'natural';
    if (R.tries === 0) { R.firstOk = ok; if (ok) R.ok++; }
    R.res = r.res; R.phase = 'fb'; App.render(); window.scrollTo(0, 0);
  };
  A.rvRetry = () => { X.rv.tries++; X.rv.phase = 'q'; App.render(); };
  A.rvNext = () => {
    const R = X.rv; R.idx++; R.text = ''; R.tries = 0; R.picked = null;
    if (R.idx >= R.all.length) { R.done = M.reviewDone(S(), R.key, R.ok, R.all.length, App.today); R.phase = 'end'; App.commit(); } else R.phase = 'q';
    App.render(); window.scrollTo(0, 0);
  };
  A.rvAgain = () => A.rvOpen({ k: X.rv.key });
  A.rvToSb = () => { X.rv = null; UI.mode = null; UI.tab = 'study'; UI.studySeg = 'sentence'; startSb(); };
  A.rvClose = () => { X.rv = null; UI.mode = null; App.render(); window.scrollTo(0, 0); };

  H.flow = () => {
    const wk = M.weakness(S(), REG, App.today).slice(0, 3), fl = M.studyFlow(S(), App.WORDS, App.today);
    let h = '<div class="card"><div class="col"><b>오늘의 추천 순서</b><p class="sub">순서는 제안일 뿐이에요. 어느 것부터 해도 괜찮아요.</p><div class="flowlist">' + fl.steps.map((st, i) => '<button class="flowstep ' + (st.done ? 'done' : '') + (fl.next === st.k ? ' next' : '') + '" data-act="studySeg" data-seg="' + st.seg + '"><span class="fn" aria-hidden="true">' + (st.done ? '✓' : i + 1) + '</span><span class="grow">' + esc(st.label) + (st.note ? '<span class="sub"> · ' + esc(st.note) + '</span>' : '') + (st.optional ? '<span class="sub"> · 선택</span>' : '') + '</span>' + (fl.next === st.k ? '<span class="tag">다음</span>' : '') + '</button>').join('') + '</div></div></div>';
    if (wk.length) h += '<div class="card"><div class="col"><b>최근 약점</b><p class="sub">최근 2주 기록 기준이에요.</p>' + wk.map(w => '<div class="row between"><span class="weakmsg grow">' + esc(w.msg) + (w.dueReview ? ' <span class="tag sun">복습할 때</span>' : '') + '</span>' + (w.hasReview ? '<button class="btn soft small" data-act="rvOpen" data-k="' + esc(w.key) + '">복습</button>' : '<span class="tag mute">자료 준비 전</span>') + '</div>').join('') + '</div></div>';
    return h;
  };

  /* ───────── 키보드·입력 이벤트 ───────── */
  document.addEventListener('input', ev => {
    const id = ev.target && ev.target.id;
    if (id === 'sbin' && X.sb) { X.sb.text = ev.target.value; clearTimeout(X._t); X._t = setTimeout(saveDraft, 400); }
    else if (id === 'grin' && X.gr) { X.gr.text = ev.target.value; clearTimeout(X._t); X._t = setTimeout(saveDraft, 400); }
    else if (id === 'cvin' && X.cv) { X.cv.text = ev.target.value; clearTimeout(X._t); X._t = setTimeout(saveDraft, 400); }
    else if (id === 'lsin' && X.ls) X.ls.text = ev.target.value;
    else if (id === 'rvin' && X.rv) X.rv.text = ev.target.value;
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.shiftKey || ev.isComposing) return; const id = ev.target && ev.target.id;
    const m = { sbin: 'sbSubmit', grin: 'grSubmit', cvin: 'cvSend', lsin: 'lsSubmit', rvin: 'rvSubmit' }[id]; if (m) { ev.preventDefault(); A[m](); }
  });
  H.onDay.push(() => { X.sb = X.sb; });
  window.__italianoX = { X, REG, E, startSb };
})();
</script>
<script>App.start()</script></body></html>
